services:
  office-converter:
    build: .
    ports:
      - "127.0.0.1:3101:3101"
    read_only: true
    tmpfs:
      - /tmp:size=768m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped
    networks:
      - converter-internal

networks:
  converter-internal:
    internal: true
