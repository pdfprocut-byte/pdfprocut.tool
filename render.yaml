services:
  - type: web
    name: pdfprocut
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start -w server
    healthCheckPath: /api/health
    domains:
      - api.pdfprocut.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://pdfprocut.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PDF_SERVICES_CLIENT_ID
        sync: false
      - key: PDF_SERVICES_CLIENT_SECRET
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false

  - type: web
    name: pdfprocut-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w client
    staticPublishPath: ./client/dist
    domains:
      - pdfprocut.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.pdfprocut.com/api
